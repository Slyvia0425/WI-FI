name: module-b-ci

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/modules/human_activity_recognition/**"
      - "frontend/src/modules/human_activity_recognition/**"
      - "backend/tests/**"
      - ".github/workflows/module-b-ci.yml"
  pull_request:
    paths:
      - "backend/modules/human_activity_recognition/**"
      - "frontend/src/modules/human_activity_recognition/**"
      - "backend/tests/**"
      - ".github/workflows/module-b-ci.yml"

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/modules/human_activity_recognition/requirements-dev.txt
      - name: Format check
        run: ruff format --check --config backend/modules/human_activity_recognition/pyproject.toml backend/modules/human_activity_recognition
      - name: Static check
        run: ruff check --config backend/modules/human_activity_recognition/pyproject.toml backend/modules/human_activity_recognition
      - name: Type check
        run: mypy --config-file backend/modules/human_activity_recognition/pyproject.toml backend/modules/human_activity_recognition
      - name: Security scan
        run: bandit -q -r backend/modules/human_activity_recognition -x backend/modules/human_activity_recognition/tests
      - name: Module tests
        run: python -m unittest discover -s backend/modules/human_activity_recognition/tests -t .
      - name: Repository contract tests
        run: python -m unittest discover -s backend/tests -t .
      - name: Frontend build
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build
